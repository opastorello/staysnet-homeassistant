blueprint:
  name: "Stays.net · Preparar a casa antes da chegada"
  description: >-
    Executa suas ações algumas horas antes do próximo check-in (por exemplo, ligar
    o ar-condicionado e acender as luzes).


    Dentro das ações você pode usar a variável `stay` com os dados do próximo
    hóspede: `stay.guest_name`, `stay.guest_count`, `stay.channel`, `stay.nights`,
    `stay.check_in`, `stay.check_out`, `stay.door_code` e `stay.reservation_id`.
  domain: automation
  author: opastorello
  source_url: https://github.com/opastorello/staysnet-homeassistant/blob/main/blueprints/automation/staysnet/pre_arrival.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    next_checkin:
      name: Sensor "Próximo check-in" da propriedade
      selector:
        entity:
          filter:
            - integration: staysnet
              domain: sensor
              device_class: timestamp
    lead_hours:
      name: Antecedência (horas antes do check-in)
      default: 2
      selector:
        number:
          min: 0.25
          max: 72
          step: 0.25
          unit_of_measurement: h
          mode: box
    pre_actions:
      name: O que fazer antes da chegada
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger_variables:
  checkin_sensor: !input next_checkin
  lead_hours: !input lead_hours

triggers:
  - trigger: template
    value_template: >-
      {% set ts = states(checkin_sensor) %}
      {{ ts not in ['unknown', 'unavailable', 'none']
         and 0 < (as_timestamp(ts) - now().timestamp()) <= (lead_hours | float) * 3600 }}

actions:
  - action: staysnet.get_stay
    data:
      entity_id: !input next_checkin
      which: next
    response_variable: stay
  - sequence: !input pre_actions
