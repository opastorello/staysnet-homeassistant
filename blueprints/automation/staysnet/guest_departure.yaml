blueprint:
  name: "Stays.net · Saída do hóspede (check-out)"
  description: >-
    Executa suas ações no horário de check-out de uma propriedade.


    Dentro das ações você pode usar a variável `stay` com os dados da estadia que
    acabou de terminar: `stay.guest_name`, `stay.guest_phone`, `stay.guest_count`,
    `stay.channel`, `stay.nights`, `stay.check_in`, `stay.check_out` e
    `stay.reservation_id`.
  domain: automation
  author: opastorello
  source_url: https://github.com/opastorello/staysnet-homeassistant/blob/main/blueprints/automation/staysnet/guest_departure.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    stays_event:
      name: Propriedade (entidade "Eventos da estadia")
      selector:
        entity:
          filter:
            - integration: staysnet
              domain: event
    departure_actions:
      name: O que fazer no check-out
      description: Desligar luzes e tomadas, travar a porta, clima em modo econômico, etc.
      selector:
        action: {}

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input stays_event

conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and (now() - as_datetime(trigger.to_state.state)).total_seconds() < 120
         and trigger.to_state.attributes.event_type == 'check_out' }}

actions:
  - action: staysnet.get_stay
    data:
      entity_id: !input stays_event
      which: last
    response_variable: stay
  - sequence: !input departure_actions
